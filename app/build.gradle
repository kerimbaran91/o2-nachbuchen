plugins {
    id 'com.android.application'
}

def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'de.kerim.o2nachbuchen'
    compileSdk 34

    defaultConfig {
        applicationId 'de.kerim.o2nachbuchen'
        minSdk 26
        targetSdk 34
        versionCode runNo
        versionName "1.${runNo - 1}"
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias 'o2nachbuchen'
            keyPassword System.getenv('KS_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
